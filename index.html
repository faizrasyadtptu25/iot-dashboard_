<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART IOT MONITORING - FAIZ PROJECT</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { background: #0b0e14; color: #c9d1d9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-top: 30px; }
        .card-custom { background: #161b22; border: 1px solid #30363d; border-radius: 15px; padding: 20px; margin-bottom: 20px; transition: 0.3s; }
        .card-custom:hover { border-color: #58a6ff; }
        .value-text { font-size: 2.8rem; font-weight: 800; color: #58a6ff; }
        .unit { font-size: 1rem; color: #8b949e; }
        .chart-container { position: relative; height: 250px; width: 100%; }
        iframe { border-radius: 10px; border: 1px solid #30363d; width: 100%; height: 450px; background: white; }
        .status-badge { font-size: 0.9rem; padding: 5px 12px; border-radius: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="text-center mb-4">
        <h1 class="fw-bold text-primary">SMART IOT MONITORING - FAIZ PROJECT</h1>
        <div class="d-flex justify-content-center align-items-center gap-3">
            <span>Logging Status: <span id="log-status" class="status-badge bg-secondary">WAITING</span></span>
            <span>Update Terakhir: <span id="last-update" class="text-info">--:--:--</span></span>
        </div>
    </div>

    <div class="row text-center">
        <div class="col-md-4">
            <div class="card-custom">
                <div class="text-secondary small fw-bold">TEMPERATURE</div>
                <div class="value-text"><span id="temp">0</span><span class="unit">°C</span></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card-custom">
                <div class="text-secondary small fw-bold">HUMIDITY</div>
                <div class="value-text"><span id="hum">0</span><span class="unit">%</span></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card-custom">
                <div class="text-secondary small fw-bold">GAS LEVEL (MQ5)</div>
                <div id="gas-type" class="fw-bold text-warning mb-1">Checking...</div>
                <div class="value-text"><span id="gas-val">0</span><span class="unit"> PPM</span></div>
                <div id="gas-alert" class="status-badge bg-success mt-2 d-inline-block">AMAN</div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="card-custom h-100">
                <h5 class="border-bottom pb-2">System Control</h5>
                <div class="mt-3">
                    <button class="btn btn-success w-100 mb-2 py-2 fw-bold" onclick="setControl('start')">▶ START LOGGING</button>
                    <button class="btn btn-danger w-100 mb-2 py-2 fw-bold" onclick="setControl('stop')">■ STOP LOGGING</button>
                    <button class="btn btn-outline-warning w-100 mb-4 fw-bold" onclick="resetLog()">RESET LOCAL TABLE</button>
                </div>
                <label class="small fw-bold">Setting Interval (Detik):</label>
                <div class="input-group">
                    <input type="number" id="intInput" class="form-control bg-dark text-white border-secondary" placeholder="Contoh: 5">
                    <button class="btn btn-primary px-4" onclick="updateInterval()">SET</button>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card-custom">
                <h5>Real-time Analytics (T & H)</h5>
                <div class="chart-container"><canvas id="thChart"></canvas></div>
            </div>
            <div class="card-custom">
                <h5>Gas Analytics (MQ5)</h5>
                <div class="chart-container"><canvas id="gasChart"></canvas></div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-7">
            <div class="card-custom">
                <h5>Cloud Spreadsheet View (History)</h5>
                <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQPb6Laeb5cq3hZ79xQ1W0ATit3EGmjQmEtTyqYaW35Y5HmZAMLaYJQ6wGq6fShBOXLFNAZgwEOafO5/pubhtml?widget=true&amp;headers=false"></iframe>
            </div>
        </div>
        <div class="col-md-5">
            <div class="card-custom">
                <h5>Local Real-time Log (10 Data)</h5>
                <div style="max-height: 400px; overflow-y: auto;">
                    <table class="table table-dark table-hover table-sm text-center">
                        <thead>
                            <tr>
                                <th>Waktu</th>
                                <th>Temp</th>
                                <th>Hum</th>
                                <th>Gas</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. CONFIG FIREBASE
    const firebaseConfig = { databaseURL: "https://monitoring-iot-20edf-default-rtdb.asia-southeast1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. CHART CONFIG (DIPISAH)
    const ctxTH = document.getElementById('thChart').getContext('2d');
    const ctxGas = document.getElementById('gasChart').getContext('2d');

    const chartOptions = { 
        responsive: true, 
        maintainAspectRatio: false,
        scales: { x: { ticks: { color: '#8b949e' } }, y: { ticks: { color: '#8b949e' } } }
    };

    let thChart = new Chart(ctxTH, {
        type: 'line',
        data: { labels: [], datasets: [
            { label: 'Suhu (°C)', borderColor: '#ff5f6d', data: [], tension: 0.3, fill: false },
            { label: 'Lembap (%)', borderColor: '#00f2fe', data: [], tension: 0.3, fill: false }
        ]},
        options: chartOptions
    });

    let gasChart = new Chart(ctxGas, {
        type: 'line',
        data: { labels: [], datasets: [
            { label: 'Gas (PPM)', borderColor: '#f9d423', data: [], tension: 0.3, backgroundColor: 'rgba(249, 212, 35, 0.1)', fill: true }
        ]},
        options: chartOptions
    });

    // 3. READ REALTIME DATA
    db.ref("monitoring").on("value", (snap) => {
        const d = snap.val();
        if(d) {
            // Update UI
            document.getElementById("temp").innerText = d.suhu;
            document.getElementById("hum").innerText = d.kelembapan;
            document.getElementById("gas-val").innerText = d.gas;
            
            // Logika Status Gas
            let gasStatus = "AMAN";
            let gasColor = "bg-success";
            let gasType = "Udara Bersih";

            if(d.gas > 400) { 
                gasStatus = "BAHAYA!"; 
                gasColor = "bg-danger"; 
                gasType = "LPG / Asap Terdeteksi"; 
            }
            
            document.getElementById("gas-alert").innerText = gasStatus;
            document.getElementById("gas-alert").className = `status-badge ${gasColor} mt-2 d-inline-block`;
            document.getElementById("gas-type").innerText = gasType;

            // Update Control Status
            const ctrl = (d.control || "stop").toUpperCase();
            document.getElementById("log-status").innerText = ctrl;
            document.getElementById("log-status").className = `status-badge ${ctrl === 'START' ? 'bg-success' : 'bg-danger'}`;

            // Update Waktu
            let now = new Date().toLocaleTimeString('id-ID');
            document.getElementById("last-update").innerText = now;

            // Update Grafik & Tabel
            updateVisuals(now, d.suhu, d.kelembapan, d.gas);
        }
    });

    function updateVisuals(time, t, h, g) {
        // Update Charts
        [thChart, gasChart].forEach(chart => {
            if(chart.data.labels.length > 10) {
                chart.data.labels.shift();
                chart.data.datasets.forEach(ds => ds.data.shift());
            }
            chart.data.labels.push(time);
        });

        thChart.data.datasets[0].data.push(t);
        thChart.data.datasets[1].data.push(h);
        gasChart.data.datasets[0].data.push(g);
        
        thChart.update();
        gasChart.update();

        // Update Local Table
        const hb = document.getElementById("historyBody");
        let row = `<tr><td>${time}</td><td>${t}°C</td><td>${h}%</td><td>${g}</td></tr>`;
        hb.insertAdjacentHTML('afterbegin', row);
        if(hb.children.length > 10) hb.removeChild(hb.lastChild);
    }

    // 4. CONTROL FUNCTIONS
    function setControl(v) { db.ref("monitoring/control").set(v); }
    function updateInterval() {
        let val = document.getElementById("intInput").value;
        if(val) {
            db.ref("monitoring/interval").set(parseInt(val));
            alert("Interval diperbarui ke " + val + " detik");
        }
    }
    function resetLog() { document.getElementById("historyBody").innerHTML = ""; }
</script>

</body>
</html>
