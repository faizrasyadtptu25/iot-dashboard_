<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOT CYBER MONITOR - FAIZ & FIAN</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b0118;
            --card-bg: rgba(26, 11, 46, 0.8);
            --neon-pink: #ff007a;
            --neon-cyan: #00f3ff;
            --neon-yellow: #fde047;
            --text-main: #ffffff;
            --text-dim: #b4a9c3;
        }

        body { 
            background: var(--bg-color); 
            background-image: radial-gradient(circle at 50% -20%, #310a5d, #0b0118);
            color: var(--text-main); 
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        .header-box { padding: 30px 0; text-shadow: 0 0 10px var(--neon-cyan); }
        .project-title { color: var(--neon-cyan); letter-spacing: 3px; font-weight: 800; text-transform: uppercase; }
        .names { color: var(--neon-pink); font-weight: 600; letter-spacing: 2px; }

        .card-cyber {
            background: var(--card-bg);
            border: 2px solid #3d126e;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .value-text { font-size: 3rem; font-weight: 900; color: #ffffff; text-shadow: 0 0 15px var(--neon-cyan); }
        .unit { font-size: 1rem; color: var(--neon-cyan); margin-left: 5px; }
        .status-badge { font-size: 0.9rem; padding: 6px 15px; border-radius: 5px; font-weight: bold; text-transform: uppercase; }
        .chart-container { position: relative; height: 250px; width: 100%; }

        .btn-cyber { border: 2px solid; background: transparent; font-weight: bold; transition: 0.3s; margin-bottom: 8px; }
        .btn-start { color: var(--neon-cyan); border-color: var(--neon-cyan); }
        .btn-start:hover { background: var(--neon-cyan); color: black; box-shadow: 0 0 15px var(--neon-cyan); }
        .btn-stop { color: var(--neon-pink); border-color: var(--neon-pink); }
        .btn-stop:hover { background: var(--neon-pink); color: white; box-shadow: 0 0 15px var(--neon-pink); }
        .btn-reset { color: var(--neon-yellow); border-color: var(--neon-yellow); font-size: 0.8rem; }
        .btn-reset:hover { background: var(--neon-yellow); color: black; }

        .table-container { max-height: 400px; overflow-y: auto; }
        .table-cyber { color: var(--text-main) !important; font-size: 0.85rem; }
        .table-cyber th { color: var(--neon-yellow); border-bottom: 2px solid var(--neon-pink); position: sticky; top: 0; background: #1a0b2e; }
        
        .btn-sheet { background: linear-gradient(45deg, #1d976c, #93f9b9); color: black; border: none; padding: 10px; font-weight: bold; }
        .label-custom { color: var(--neon-yellow); font-weight: bold; font-size: 0.8rem; }
        input.form-control { background: #000; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); }
    </style>
</head>
<body>

<div class="container py-3">
    <div class="text-center header-box">
        <h2 class="project-title">Smart IoT Monitoring</h2>
        <h5 class="names">FAIZ & FIAN PROJECT</h5>
        <div class="mt-2">
            <span class="label-custom">STATUS:</span> 
            <span id="log-status" class="status-badge bg-secondary">LOADING</span>
        </div>
    </div>

    <div class="row text-center mb-3">
        <div class="col-md-4">
            <div class="card-cyber">
                <div class="label-custom">TEMPERATURE</div>
                <div class="value-text"><span id="temp">0</span><span class="unit">°C</span></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card-cyber">
                <div class="label-custom">HUMIDITY</div>
                <div class="value-text" style="text-shadow: 0 0 15px var(--neon-pink);"><span id="hum">0</span><span class="unit" style="color: var(--neon-pink);">%</span></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card-cyber">
                <div class="label-custom">GAS LEVEL</div>
                <div class="value-text" style="text-shadow: 0 0 15px var(--neon-yellow);"><span id="gas-val">0</span><span class="unit" style="color: var(--neon-yellow);">PPM</span></div>
                <div id="gas-label" class="small text-white">Analysing...</div>
                <span id="gas-status" class="status-badge bg-secondary mt-1">WAITING</span>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="card-cyber">
                <h6 class="text-white border-bottom pb-2 mb-3">System Control</h6>
                <button class="btn btn-cyber btn-start w-100" onclick="updateControl('start')">START LOGGING</button>
                <button class="btn btn-cyber btn-stop w-100" onclick="updateControl('stop')">STOP LOGGING</button>
                <button class="btn btn-cyber btn-reset w-100 mt-2" onclick="resetLocalLog()">RESET LOCAL HISTORY</button>
                
                <div class="mt-3">
                    <label class="label-custom">Interval (s):</label>
                    <div class="input-group input-group-sm">
                        <input type="number" id="inputInterval" class="form-control" placeholder="10">
                        <button class="btn btn-info fw-bold" onclick="setIntervalFirebase()">SET</button>
                    </div>
                    <p class="small mt-1 text-dim">Current: <span id="current-interval" class="text-info">--</span>s</p>
                </div>
            </div>

            <div class="card-cyber">
                <h6 class="text-white border-bottom pb-2 mb-3">Cloud Data</h6>
                <a href="https://docs.google.com/spreadsheets/d/1tOldPDWt8bSMQEHbNFAw1R3bnHn9nBJska-7hAAMKoY/edit?usp=sharing" target="_blank" class="btn btn-sheet w-100 btn-sm">
                    VIEW SPREADSHEET ↗
                </a>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card-cyber">
                <h6 class="text-white mb-2">Live Charts</h6>
                <div class="chart-container"><canvas id="chartTH"></canvas></div>
                <div class="chart-container mt-3"><canvas id="chartGas"></canvas></div>
            </div>
        </div>
    </div>

    <div class="row mt-2">
        <div class="col-12">
            <div class="card-cyber">
                <h6 class="text-white border-bottom pb-2 mb-3">Real-time Local History (Last 20 Data)</h6>
                <div class="table-container">
                    <table class="table table-dark table-hover table-cyber text-center">
                        <thead>
                            <tr>
                                <th>TIME</th>
                                <th>TEMP (°C)</th>
                                <th>HUM (%)</th>
                                <th>GAS (PPM)</th>
                                <th>STATUS</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. FIREBASE CONFIG
    const firebaseConfig = { databaseURL: "https://monitoring-iot-20edf-default-rtdb.asia-southeast1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. CHART CONFIG
    Chart.defaults.color = '#b4a9c3';
    const chartOptions = { responsive: true, maintainAspectRatio: false, scales: { y: { grid: { color: '#220a46' } }, x: { grid: { display: false } } } };

    const ctxTH = document.getElementById('chartTH').getContext('2d');
    const chartTH = new Chart(ctxTH, {
        type: 'line',
        data: { labels: [], datasets: [
            { label: 'Temp', borderColor: '#00f3ff', data: [], tension: 0.4, borderWidth: 2 },
            { label: 'Hum', borderColor: '#ff007a', data: [], tension: 0.4, borderWidth: 2 }
        ]},
        options: chartOptions
    });

    const ctxGas = document.getElementById('chartGas').getContext('2d');
    const chartGas = new Chart(ctxGas, {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'Gas (PPM)', borderColor: '#fde047', data: [], tension: 0.4, backgroundColor: 'rgba(253, 224, 71, 0.1)', fill: true, borderWidth: 2 }]},
        options: chartOptions
    });

    // 3. LISTEN TO FIREBASE
    db.ref("monitoring").on("value", (snapshot) => {
        const data = snapshot.val();
        if (data) {
            document.getElementById("temp").innerText = data.suhu ? data.suhu.toFixed(1) : 0;
            document.getElementById("hum").innerText = data.kelembapan ? data.kelembapan.toFixed(0) : 0;
            const gVal = data.gas || 0;
            document.getElementById("gas-val").innerText = gVal.toFixed(1);
            document.getElementById("current-interval").innerText = data.interval || 0;

            const logStatus = document.getElementById("log-status");
            logStatus.innerText = (data.control || "STOP").toUpperCase();
            logStatus.className = data.control === "start" ? "status-badge bg-success" : "status-badge bg-danger";

            let gStatus = gVal >= 300 ? "BAHAYA" : (gVal > 150 ? "WASPADA" : "AMAN");
            let gClass = gVal >= 300 ? "bg-danger" : (gVal > 150 ? "bg-warning text-dark" : "bg-success");
            
            document.getElementById("gas-label").innerText = gVal >= 300 ? "KEBOCORAN TERDETEKSI!" : "Kualitas Udara: Baik";
            document.getElementById("gas-status").innerText = gStatus;
            document.getElementById("gas-status").className = "status-badge " + gClass;

            const timeNow = new Date().toLocaleTimeString();
            updateCharts(timeNow, data.suhu, data.kelembapan, gVal);
            updateTable(timeNow, data.suhu, data.kelembapan, gVal, gStatus, gClass);
        }
    });

    function updateCharts(time, t, h, g) {
        if (chartTH.data.labels.length > 15) {
            chartTH.data.labels.shift(); chartTH.data.datasets[0].data.shift(); chartTH.data.datasets[1].data.shift();
            chartGas.data.labels.shift(); chartGas.data.datasets[0].data.shift();
        }
        chartTH.data.labels.push(time); chartTH.data.datasets[0].data.push(t); chartTH.data.datasets[1].data.push(h);
        chartGas.data.labels.push(time); chartGas.data.datasets[0].data.push(g);
        chartTH.update(); chartGas.update();
    }

    function updateTable(time, t, h, g, stat, cls) {
        const tbody = document.getElementById("tableBody");
        const row = `<tr>
            <td>${time}</td>
            <td>${t.toFixed(1)}</td>
            <td>${h.toFixed(0)}</td>
            <td>${g.toFixed(1)}</td>
            <td><span class="badge ${cls}" style="font-size:0.7rem">${stat}</span></td>
        </tr>`;
        tbody.insertAdjacentHTML('afterbegin', row);
        if (tbody.children.length > 20) tbody.removeChild(tbody.lastChild);
    }

    function resetLocalLog() {
        document.getElementById("tableBody").innerHTML = "";
        chartTH.data.labels = []; chartTH.data.datasets.forEach(d => d.data = []);
        chartGas.data.labels = []; chartGas.data.datasets[0].data = [];
        chartTH.update(); chartGas.update();
        alert("Histori Lokal Direset!");
    }

    function updateControl(command) { db.ref("monitoring/control").set(command); }
    function setIntervalFirebase() {
        const val = document.getElementById("inputInterval").value;
        if (val > 0) db.ref("monitoring/interval").set(parseInt(val));
    }
</script>

</body>
</html>
